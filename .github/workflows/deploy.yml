name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HOST: ${{ secrets.SSH_HOST }}
      USER: ${{ secrets.SSH_USER }}
      PORT: ${{ secrets.SSH_PORT }}
      KEY: ${{ secrets.SSH_KEY }}
      WEB_DIR: ${{ vars.WEB_DIR }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Deploy to server
        run: |
          echo "$KEY" > ssh_key
          chmod 600 ssh_key

          ssh -i ssh_key \
            -p "$PORT" \
            -o StrictHostKeyChecking=no \
            "$USER@$HOST" \
            "set -e && \
             curl -fsSL -o /tmp/site.tar.gz https://github.com/$REPO/releases/download/$TAG/site.tar.gz && \
             mkdir -p '$WEB_DIR' && \
             find '$WEB_DIR' -mindepth 1 -delete && \
             tar -xzf /tmp/site.tar.gz -C '$WEB_DIR' && \
             rm /tmp/site.tar.gz"

          rm ssh_key
